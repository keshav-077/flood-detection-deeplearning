<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="utitle udesc">
  <title id="utitle">U-Net encoder-decoder architecture</title>
  <desc id="udesc">Contracting path, bottleneck, and expanding path with skip connections for 256 by 256 six channel input.</desc>
  <defs>
    <linearGradient id="enc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="dec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="920" height="520" rx="16" fill="#0f172a"/>
  <text x="460" y="42" text-anchor="middle" fill="#f1f5f9" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">U-Net · 6 ’ 1 channel segmentation</text>
  <text x="460" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">Input (256×256×6) · filters 64’128’256’512’1024 · LeakyReLU · Dropout at bottleneck</text>

  <!-- Input -->
  <rect x="30" y="220" width="56" height="80" rx="8" fill="#334155" stroke="#64748b"/>
  <text x="58" y="208" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="Segoe UI, sans-serif">Input</text>
  <text x="58" y="318" text-anchor="middle" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">6 ch</text>

  <!-- Encoder blocks -->
  <g font-family="Segoe UI, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
    <rect x="110" y="200" width="64" height="120" rx="6" fill="url(#enc)"/>
    <text x="142" y="188">64×2</text>
    <text x="142" y="340">256²</text>

    <rect x="200" y="175" width="64" height="145" rx="6" fill="url(#enc)" opacity="0.95"/>
    <text x="232" y="163">128×2</text>
    <text x="232" y="340">128²</text>

    <rect x="290" y="150" width="64" height="170" rx="6" fill="url(#enc)" opacity="0.9"/>
    <text x="322" y="138">256×2</text>
    <text x="322" y="340">64²</text>

    <rect x="380" y="125" width="64" height="195" rx="6" fill="url(#enc)" opacity="0.85"/>
    <text x="412" y="113">512×2</text>
    <text x="412" y="340">32²</text>
  </g>

  <!-- Bottleneck -->
  <rect x="470" y="95" width="80" height="225" rx="8" fill="url(#bot)" filter="url(#glow)"/>
  <text x="510" y="82" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">1024×2</text>
  <text x="510" y="340" text-anchor="middle" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">16²</text>
  <text x="510" y="210" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="Segoe UI, sans-serif">Dropout</text>

  <!-- Decoder blocks -->
  <g font-family="Segoe UI, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">
    <rect x="580" y="125" width="64" height="195" rx="6" fill="url(#dec)"/>
    <text x="612" y="113">512×2</text>

    <rect x="670" y="150" width="64" height="170" rx="6" fill="url(#dec)" opacity="0.95"/>
    <text x="702" y="138">256×2</text>

    <rect x="760" y="175" width="64" height="145" rx="6" fill="url(#dec)" opacity="0.9"/>
    <text x="792" y="163">128×2</text>

    <rect x="850" y="200" width="56" height="120" rx="6" fill="url(#dec)" opacity="0.85"/>
    <text x="878" y="188">64’1</text>
  </g>

  <!-- Output -->
  <rect x="850" y="230" width="56" height="60" rx="6" fill="#0ea5e9" stroke="#38bdf8"/>
  <text x="878" y="318" text-anchor="middle" fill="#64748b" font-size="9" font-family="Segoe UI, sans-serif">Ã mask</text>

  <!-- Pooling chevrons -->
  <g fill="none" stroke="#475569" stroke-width="1.5">
    <path d="M174 260 l8 12 l8 -12"/>
    <path d="M264 260 l8 12 l8 -12"/>
    <path d="M354 260 l8 12 l8 -12"/>
    <path d="M444 260 l8 12 l8 -12"/>
  </g>

  <!-- Upsampling chevrons -->
  <g fill="none" stroke="#22d3ee" stroke-width="1.5">
    <path d="M552 260 l8 -12 l8 12"/>
    <path d="M642 260 l8 -12 l8 12"/>
    <path d="M732 260 l8 -12 l8 12"/>
    <path d="M822 260 l8 -12 l8 12"/>
  </g>

  <!-- Skip connections -->
  <g fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.85">
    <path d="M142 200 C142 120 612 120 612 125"/>
    <path d="M232 175 C232 100 702 100 702 150"/>
    <path d="M322 150 C322 85 792 85 792 175"/>
    <path d="M412 125 C412 70 878 70 878 200"/>
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <g stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 6">
    <path d="M142 200 C142 120 612 120 612 125" fill="none"/>
    <path d="M232 175 C232 100 702 100 702 150" fill="none"/>
    <path d="M322 150 C322 85 792 85 792 175" fill="none"/>
    <path d="M412 125 C412 70 878 70 878 200" fill="none"/>
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- Labels -->
  <text x="280" y="400" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">Encoder (MaxPool “)</text>
  <text x="640" y="400" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">Decoder (UpSample ‘ + concat skips)</text>
  <rect x="200" y="430" width="520" height="56" rx="10" fill="#1e293b" stroke="#334155"/>
  <text x="460" y="452" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">Loss: binary cross-entropy · Optimizer: Adam (lr=1e-4)</text>
  <text x="460" y="472" text-anchor="middle" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="10">Monitor Dice for EarlyStopping, checkpointing, and ReduceLROnPlateau</text>
</svg>
